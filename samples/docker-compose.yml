# Ambiente de demonstração sem hardware: o simulador de equipamento, o dashboard em tempo real (Blazor Server) e o
# dashboard do Aspire (traces, métricas e logs).
#
#   docker compose -f samples/docker-compose.yml up --build -d
#
# Dashboard em tempo real: http://localhost:8081 (já configura o Monitor do simulador sozinho; use "Identificar").
# Simulador: http://localhost:8080 (estado em /simulator/state). Aspire: http://localhost:18888. OTLP: localhost:4317.
# O samples/ControlId.Net.Server mostra como ligar o ControlId.Net aos dois (veja o comentário no topo do Program.cs).
services:
  simulator:
    build:
      context: ..
      dockerfile: tools/ControlId.Net.Simulator/Dockerfile
    ports:
      - "8080:8080"

  dashboard:
    build:
      context: ..
      dockerfile: samples/ControlId.Net.Dashboard/Dockerfile
    depends_on:
      - simulator
    environment:
      # O simulador recebe o Monitor apontado para "dashboard:8080" (a rede do Compose resolve o nome do serviço).
      Dashboard__DeviceAddress: http://simulator:8080
      Dashboard__MonitorHostname: dashboard
      Dashboard__MonitorPort: "8080"
    ports:
      - "8081:8080"

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.1
    environment:
      # Só para demonstração local: sem login no dashboard.
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"
      - "4317:18889"
