name: CI

# Roda a cada push na main e em cada pull request (ADR 0009). Em repositório público os runners padrão do GitHub não
# consomem a cota de minutos da conta. Mudanças só de documentação não disparam a CI.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

# Um push novo no mesmo PR ou branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # SDK 10 para compilar o alvo net10.0 dos testes; runtime 8 para executar o alvo net8.0.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore
      # Avisos viram erro: o build fica sem nenhum aviso (CONTRIBUTING.md).
      - run: dotnet build --no-restore -c Release -warnaserror
      # net48 não executa no Linux; ele roda no job netfx.
      - run: dotnet test tests/ControlId.Net.Tests --no-build -c Release -f net8.0 --collect:"XPlat Code Coverage" --results-directory coverage
      - run: dotnet test tests/ControlId.Net.Tests --no-build -c Release -f net10.0
      # Ponta a ponta: a biblioteca contra o simulador de equipamento, com HTTP de verdade.
      - run: dotnet test tests/ControlId.Net.IntegrationTests --no-build -c Release
      # O pack valida a API contra a versão publicada (EnablePackageValidation): uma quebra não declarada falha aqui.
      - run: dotnet pack -c Release --no-build -o artifacts

      - name: Coverage summary
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.12
          ~/.dotnet/tools/reportgenerator "-reports:coverage/**/coverage.cobertura.xml" -targetdir:coverage/report -reporttypes:MarkdownSummaryGithub "-assemblyfilters:+ControlId.Net*"
          cat coverage/report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*

  # Constrói a imagem do simulador e confere que ela sobe e atende login e leitura de usuários.
  simulator-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f tools/ControlId.Net.Simulator/Dockerfile -t controlid-simulator .
      - name: Smoke test
        run: |
          docker run -d --rm -p 8080:8080 --name sim controlid-simulator
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health && break; sleep 1; done
          session=$(curl -sf -X POST http://localhost:8080/login.fcgi -H 'Content-Type: application/json' \
            -d '{"login":"admin","password":"admin"}' | jq -r .session)
          curl -sf -X POST "http://localhost:8080/load_objects.fcgi?session=$session" -H 'Content-Type: application/json' \
            -d '{"object":"users"}' | jq -e '.users | length == 3'
          docker stop sim

  # Sobe o simulador no modo REP e confere a saúde, o estado e uma marcação.
  simulator-rep-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet build tools/ControlId.Net.Simulator -c Release
      - name: Smoke test
        run: |
          dotnet run --project tools/ControlId.Net.Simulator -c Release --no-build -- --Simulator:Kind=Rep --urls http://localhost:8082 &
          for i in $(seq 1 30); do curl -sf http://localhost:8082/health && break; sleep 1; done
          curl -sf http://localhost:8082/simulator/state | jq -e .
          curl -sf -X POST http://localhost:8082/simulator/punch -H 'Content-Type: application/json' -d '{"cpf":12345678901}'

  # Testa o build netstandard2.0 das bibliotecas no .NET Framework 4.8.
  netfx:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet test tests/ControlId.Net.Tests -c Release -f net48
