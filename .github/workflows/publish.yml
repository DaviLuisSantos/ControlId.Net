name: Publish

# Cria uma tag v0.1.0 (por exemplo) e faz push: os pacotes ControlId.Net, ControlId.Net.DependencyInjection e
# ControlId.Net.AspNetCore vão para o NuGet.org.
#
# Usa Trusted Publishing (OIDC): não há chave do NuGet guardada no repositório. É preciso, uma vez:
# - no nuget.org, uma política de Trusted Publishing para este repositório e o arquivo "publish.yml";
# - no GitHub, o secret NUGET_USER com o nome de usuário (perfil) do nuget.org, não o e-mail.
on:
  push:
    tags: ['v*.*.*']

jobs:
  # Só publica se os testes passarem também no .NET Framework 4.8.
  netfx:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # SDK 10 para compilar o alvo net10.0 dos testes; runtime 8 para executar o alvo net8.0.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet test tests/ControlId.Net.Tests -c Release -f net48

  publish:
    needs: netfx
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # token OIDC trocado por uma chave temporária do NuGet
    steps:
      - uses: actions/checkout@v7
      # SDK 10 para compilar o alvo net10.0 dos testes; runtime 8 para executar o alvo net8.0.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
      - run: dotnet test tests/ControlId.Net.Tests -c Release -f net8.0
      - run: dotnet test tests/ControlId.Net.Tests -c Release -f net10.0
      - run: dotnet pack -c Release -o artifacts -p:Version=$VERSION

      # A chave dura 1 hora: pedida só depois de testar e empacotar.
      - name: NuGet login (OIDC)
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
